function svgIcon(emoji){var e=String(emoji||'🛒');var svg='<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><rect width="160" height="160" rx="38" fill="#f0f2ee"/><text x="80" y="104" text-anchor="middle" font-size="78" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">'+e+'</text></svg>';return 'data:image/svg+xml,'+encodeURIComponent(svg)}
function imageFor(name){return svgIcon(EMOJI_MAP[slug(name)]||'🛒')}

function save(){localStorage.setItem('compra_v2_products',JSON.stringify(products));localStorage.setItem('compra_v2_selected',JSON.stringify([...selected]));localStorage.setItem('compra_v2_collapsed',JSON.stringify([...collapsed]));}

function count(){let n=selected.size,total=products.length;$('#counter').textContent=`${n} / ${total}`;}

if(products){let changed=false;products.forEach(p=>{const next=imageFor(p.name);if(!p.image||p.image.includes('loremflickr')||p.image!==next){p.image=next;changed=true}});if(changed)save();}
function productHTML(p){return `<div class="product ${selected.has(p.id)?'selected':''}" data-id="${p.id}"><button class="check" aria-label="Marcar">${selected.has(p.id)?'✓':''}</button><img class="pimg" src="${esc(p.image||imageFor(p.name))}" alt="" loading="lazy" onerror="this.style.display='none'"><span class="pname">${esc(p.name)}</span></div>`}
function renderPurchase(){const root=$('#purchaseList');const by={};products.filter(p=>selected.has(p.id)).forEach(p=>(by[p.cat]??=[]).push(p));root.innerHTML='';Object.entries(by).forEach(([cat,arr])=>{const c=cats.find(x=>x.name===cat);const el=document.createElement('div');el.className='purchase-card';el.innerHTML=`<div class="purchase-cat">${c?.icon||'📦'} ${esc(cat)}</div>${arr.map(p=>`<div class="purchase-item"><img class="pimg" src="${esc(p.image||imageFor(p.name))}" alt="" loading="lazy"><b>${esc(p.name)}</b><button class="remove" data-id="${p.id}">✕</button></div>`).join('')}`;root.appendChild(el)});$('#emptyPurchase').classList.toggle('hidden',root.children.length>0)}
function renderManage(){const root=$('#manageList');root.innerHTML='';cats.forEach(c=>{const arr=products.filter(p=>p.cat===c.name);if(!arr.length)return;const block=document.createElement('div');block.innerHTML=`<div class="hint" style="font-weight:800;margin-top:15px">${c.icon} ${esc(c.name)}</div>`+arr.map((p,i)=>`<div class="edit-row" data-id="${p.id}"><img class="edit-img" src="${esc(p.image||imageFor(p.name))}" alt="" loading="lazy"><span class="edit-icon">${esc(p.icon||'🛒')}</span><div class="edit-info"><div class="edit-name">${esc(p.name)}</div><div class="edit-cat">${esc(p.cat)}</div></div><button class="smallbtn up" title="Subir">↑</button><button class="smallbtn down" title="Bajar">↓</button><button class="smallbtn edit" title="Editar">✎</button><button class="smallbtn danger del" title="Eliminar">×</button></div>`).join('');root.appendChild(block)});}
function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function toggle(id){selected.has(id)?selected.delete(id):selected.add(id);save();render();}
document.addEventListener('click',e=>{const p=e.target.closest('.product');if(p){toggle(p.dataset.id);return}const rem=e.target.closest('.remove');if(rem){selected.delete(rem.dataset.id);save();render();return}const row=e.target.closest('.edit-row');if(row){if(e.target.closest('.edit'))openModal(row.dataset.id);if(e.target.closest('.del'))removeProduct(row.dataset.id);if(e.target.closest('.up'))move(row.dataset.id,-1);if(e.target.closest('.down'))move(row.dataset.id,1);}});
function move(id,dir){const p=products.find(x=>x.id===id);if(!p)return;const idx=products.indexOf(p);let j=idx+dir;while(j>=0&&j<products.length&&products[j].cat!==p.cat)j+=dir;if(j>=0&&j<products.length){[products[idx],products[j]]=[products[j],products[idx]];save();render();}}
function removeProduct(id){const p=products.find(x=>x.id===id);if(!p)return;if(!confirm(`¿Eliminar “${p.name}”?`))return;products=products.filter(x=>x.id!==id);selected.delete(id);save();render();toast('Producto eliminado');}
function openModal(id=null){$('#modal').classList.add('open');$('#modalTitle').textContent=id?'Editar producto':'Nuevo producto';$('#productForm').dataset.id=id||'';$('#pCat').innerHTML=cats.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');if(id){const p=products.find(x=>x.id===id);$('#pName').value=p.name;$('#pCat').value=p.cat;$('#pIcon').value=p.icon||'';$('#pImage').value=p.image||'';}else{$('#productForm').reset();$('#pIcon').value='🛒';$('#pImage').value='';}}
function closeModal(){$('#modal').classList.remove('open');}
$('#productForm').onsubmit=e=>{e.preventDefault();const id=e.currentTarget.dataset.id;const name=$('#pName').value.trim();const cat=$('#pCat').value;const icon=$('#pIcon').value.trim()||'🛒';const image=$('#pImage').value.trim()||imageFor(name);if(id){const p=products.find(x=>x.id===id);Object.assign(p,{name,cat,icon,image});toast('Producto actualizado')}else{products.push({id:crypto.randomUUID(),name,cat,icon,image});toast('Producto creado')}save();closeModal();render();};
$('#newProduct').onclick=()=>openModal();$('#fab').onclick=()=>openModal();$('#closeModal').onclick=closeModal;$('#cancelForm').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('#clearSelected').onclick=()=>{if(selected.size&&!confirm('¿Vaciar toda la compra?'))return;selected.clear();save();render();toast('Compra vaciada')};
$('#search').oninput=()=>{renderList();$('#clearSearch').style.display=$('#search').value?'block':'none'};$('#clearSearch').onclick=()=>{$('#search').value='';$('#clearSearch').style.display='none';renderList();$('#search').focus()};
$$('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));function switchView(v){$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$$('.view').forEach(x=>x.classList.remove('active'));$('#'+v+'View').classList.add('active');$('#pageTitle').textContent=v==='list'?'Lista':v==='buy'?'Mi compra':'Editar lista';$('#searchBox').style.display=v==='list'?'flex':'none';$('#fab').style.display=v==='manage'?'none':'block';window.scrollTo({top:0,behavior:'smooth'});render();}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove('show'),1600)}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
